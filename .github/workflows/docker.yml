# Author: Maurizio Verde — LastReload
# Builds the image and smoke-tests it: proxy + dashboard in one container, against the fake engine on the runner.
# No secrets, no model — the key is a fixed string.
name: docker
on:
  push:
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/docker.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the package (the fake engine runs on the runner)
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install .
      - name: build the image
        run: docker build -t mnemonic-proxy:ci .
      - name: fake engine
        run: |
          cd /tmp
          /tmp/venv/bin/python -m ctxproxy.fake_engine --flavor llama --n-ctx 32768 --port 18095 &
          for i in $(seq 1 50); do curl -sf localhost:18095/health > /dev/null && break; sleep 0.2; done
      - name: start the container
        run: |
          docker run -d --name smoke --add-host=host.docker.internal:host-gateway \
            -e UPSTREAM=http://host.docker.internal:18095 -e API_KEY=ci-key -e REQUIRE_API_KEY=1 \
            -p 127.0.0.1:8096:8096 mnemonic-proxy:ci
      - name: the proxy takes the key and refuses the rest
        run: |
          code=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-key' localhost:8096/health)
            [ "$code" = 200 ] && break
            sleep 0.5
          done
          test "$code" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8096/health)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-key' \
            -H 'Content-Type: application/json' -d '{"model":"local-model","messages":[{"role":"user","content":"hi"}]}' \
            localhost:8096/v1/chat/completions)" = 200
      - name: the dashboard answers inside the container
        run: |
          docker exec smoke python -c "import urllib.request,json;print(json.load(urllib.request.urlopen('http://127.0.0.1:8097/health',timeout=5)))"
          # forwards the key to the proxy: 200 here means it did (401 would mean it did not)
          docker exec smoke python -c "import urllib.request;print(urllib.request.urlopen('http://127.0.0.1:8097/api/marks?conv=smoke',timeout=5).status)"
      - name: logs
        run: |
          docker logs smoke 2>&1 | tee /tmp/docker-logs.txt
          grep -q '\[ctx-dashboard\]' /tmp/docker-logs.txt
          docker inspect -f '{{.State.Running}}' smoke | grep -q true
